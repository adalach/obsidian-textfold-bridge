# Push a tag equal to manifest.json's version (such as 0.1.0, no "v") to build the plugin and open a
# draft release with main.js, manifest.json and styles.css attached. Publish the draft on GitHub.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write # attestations: sign the build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Check the tag against manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Attest that the release files were built from this repository
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft --generate-notes main.js manifest.json styles.css
